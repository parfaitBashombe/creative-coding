<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1012" />
    <title>Flow Field</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="artboard" aria-label="Interactive flow field">
        <canvas id="field" aria-label="Animated flow field"></canvas>
        <div class="grain" aria-hidden="true"></div>

        <header class="masthead">
          <span class="brand">Flow Field</span>
          <span class="instruction">hover to distort</span>
        </header>

        <div class="status" aria-live="polite">
          <span class="pulse" aria-hidden="true"></span>
          <span id="status-text">running</span>
        </div>

        <aside class="control-panel" aria-label="Flow controls">
          <div class="panel-heading">
            <span>Parameters</span>
            <button id="reseed" class="text-button" type="button">Reseed</button>
          </div>

          <label class="control-row" for="density">
            <span>Density <output id="density-value">80</output></span>
            <input id="density" type="range" min="20" max="160" value="80" />
          </label>

          <label class="control-row" for="speed">
            <span>Speed <output id="speed-value">42</output></span>
            <input id="speed" type="range" min="10" max="90" value="42" />
          </label>

          <div class="palette-control">
            <span>Ink</span>
            <div class="palette-options" role="group" aria-label="Color palette">
              <button class="swatch active" data-palette="riso"   type="button" aria-label="Riso palette"></button>
              <button class="swatch offset" data-palette="offset" type="button" aria-label="Offset palette"></button>
              <button class="swatch litho"  data-palette="litho"  type="button" aria-label="Litho palette"></button>
            </div>
          </div>

          <div class="panel-actions">
            <button id="pause" class="action-button" type="button" aria-pressed="false">Pause</button>
            <button id="export" class="icon-button" type="button" aria-label="Download field image" title="Download">↓</button>
          </div>
        </aside>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
