<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1012" />
    <title>Orbit Weaver</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="artboard" aria-label="Interactive particle field">
        <canvas id="field" aria-label="Animated orbit field"></canvas>
        <div class="grain" aria-hidden="true"></div>

        <header class="masthead">
          <a class="brand" href="." aria-label="Orbit Weaver home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>Orbit Weaver</span>
          </a>
          <p class="instruction">Move through the field to bend its paths.</p>
        </header>

        <section class="title-block" aria-labelledby="art-title">
          <p class="eyebrow">Generative study</p>
          <h1 id="art-title">A quiet system<br />in motion.</h1>
          <p>Each pass makes a different map of proximity, memory, and drift.</p>
        </section>

        <div class="status" aria-live="polite">
          <span class="pulse" aria-hidden="true"></span>
          <span id="status-text">Field active</span>
        </div>

        <aside class="control-panel" aria-label="Field controls">
          <div class="panel-heading">
            <span>Field controls</span>
            <button id="randomize" class="text-button" type="button">Recompose</button>
          </div>

          <label class="control-row" for="density">
            <span>Density <output id="density-value">68</output></span>
            <input id="density" type="range" min="24" max="120" value="68" />
          </label>

          <label class="control-row" for="energy">
            <span>Energy <output id="energy-value">42</output></span>
            <input id="energy" type="range" min="10" max="90" value="42" />
          </label>

          <div class="palette-control">
            <span>Palette</span>
            <div class="palette-options" role="group" aria-label="Color palette">
              <button class="swatch active" data-palette="ember" type="button" aria-label="Ember palette"></button>
              <button class="swatch tide" data-palette="tide" type="button" aria-label="Tide palette"></button>
              <button class="swatch moss" data-palette="moss" type="button" aria-label="Moss palette"></button>
            </div>
          </div>

          <div class="panel-actions">
            <button id="pause" class="action-button" type="button" aria-pressed="false">Pause field</button>
            <button id="export" class="icon-button" type="button" aria-label="Download field image" title="Download field image">↓</button>
          </div>
        </aside>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
